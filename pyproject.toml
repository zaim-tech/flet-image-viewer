[project]
name = "flet-image-viewer"
version = "0.1.0"
description = "A zoomable image viewer and swipeable gallery control for Flet"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet contributors", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.5",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://github.com/zaim-tech/flet-image-viewer"
Documentation = "https://zaim-tech.github.io/flet-image-viewer/"
Repository = "https://github.com/zaim-tech/flet-image-viewer"
Issues = "https://github.com/zaim-tech/flet-image-viewer/issues"

[tool.setuptools.package-data]
"flutter.flet_image_viewer" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
